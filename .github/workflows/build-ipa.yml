name: Build IPA

# 触发方式：
#   1) push 到 main/master
#   2) 打 tag（v1.0.1 这种）→ 除了 artifact，还会自动挂到 Release
#   3) 手动点击 Actions → Build IPA → Run workflow
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SCHEME: KanAV
  PROJECT: KanAV.xcodeproj
  APP_NAME: KanAV
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "runner: $RUNNER_OS / $RUNNER_ARCH"

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "building version ${VERSION} (build ${GITHUB_RUN_NUMBER})"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml --project .
          plutil -lint KanAV/Info.plist
          xcodebuild -list -project "$PROJECT"

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log

      - name: Package into IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "找不到产物：$APP_PATH"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi

          rm -rf Payload "${APP_NAME}-unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP_PATH" "Payload/${APP_NAME}.app"

          # 未签名包里不应该留签名残留，顺手清掉 Mac 扩展属性
          rm -rf "Payload/${APP_NAME}.app/_CodeSignature"
          xattr -cr "Payload/${APP_NAME}.app" || true

          zip -qry "${APP_NAME}-unsigned.ipa" Payload
          rm -rf Payload

          ls -lh "${APP_NAME}-unsigned.ipa"
          echo "--- ipa 结构 ---"
          unzip -l "${APP_NAME}-unsigned.ipa" | head -n 25
          echo "--- sha256 ---"
          shasum -a 256 "${APP_NAME}-unsigned.ipa" | tee checksum.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: |
            ${{ env.APP_NAME }}-unsigned.ipa
            checksum.txt
            build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}-unsigned.ipa
            checksum.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
