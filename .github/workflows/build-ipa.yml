name: Build IPA

# 触发方式：
#   1) push 到 main/master
#   2) 打 tag（v1.0.7 这种）→ 除了 artifact，还会自动挂到 Release
#   3) 手动点击 Actions → Build IPA → Run workflow
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SCHEME: KanAV
  PROJECT: KanAV.xcodeproj
  APP_NAME: KanAV
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "runner: $RUNNER_OS / $RUNNER_ARCH"

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "building version ${VERSION} (build ${GITHUB_RUN_NUMBER})"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # whisper.cpp 现场编译成 xcframework；失败不影响主流程，App 自动回退到系统识别
      - name: Build whisper.cpp xcframework
        id: whisper
        continue-on-error: true
        run: |
          set -e
          brew install cmake || true
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cd /tmp/whisper.cpp

          # 静态打包：直接链进主二进制，不需要 embed、不引入 rpath
          BUILD_STATIC_XCFRAMEWORK=ON ./build-xcframework.sh

          FW_DIR="$GITHUB_WORKSPACE/Frameworks"
          mkdir -p "$FW_DIR"
          echo "--- xcframework 内容 ---"
          ls -1 build-apple/whisper.xcframework

          # 取真机 slice（ios-arm64），链接时 -framework 只认扁平的 whisper.framework
          SLICE=$(find build-apple/whisper.xcframework -maxdepth 2 -name "whisper.framework" -type d | grep -v simulator | head -n1)
          echo "slice: $SLICE"
          test -n "$SLICE"
          cp -R "$SLICE" "$FW_DIR/whisper.framework"

          echo "--- 产物 ---"
          ls -R "$FW_DIR/whisper.framework" | head -30
          file "$FW_DIR/whisper.framework/whisper" || true
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml --project .
          plutil -lint KanAV/Info.plist
          xcodebuild -list -project "$PROJECT"

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          if [ "${{ steps.whisper.outputs.enabled }}" = "true" ]; then
            WFLAGS="-framework whisper"
            echo "whisper.cpp 已链接"
          else
            WFLAGS=""
            echo "whisper.cpp 未编译成功，使用系统识别兜底"
          fi
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            OTHER_LDFLAGS="$WFLAGS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log

      - name: Package into IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "找不到产物：$APP_PATH"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi

          rm -rf Payload "${APP_NAME}-unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP_PATH" "Payload/${APP_NAME}.app"
          rm -rf "Payload/${APP_NAME}.app/_CodeSignature"
          xattr -cr "Payload/${APP_NAME}.app" || true

          zip -qry "${APP_NAME}-unsigned.ipa" Payload
          rm -rf Payload

          ls -lh "${APP_NAME}-unsigned.ipa"
          unzip -l "${APP_NAME}-unsigned.ipa" | head -n 25
          shasum -a 256 "${APP_NAME}-unsigned.ipa" | tee checksum.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: |
            ${{ env.APP_NAME }}-unsigned.ipa
            checksum.txt
            build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}-unsigned.ipa
            checksum.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
